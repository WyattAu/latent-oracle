name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            compiler: g++
          - preset: clang-debug
            compiler: clang++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j
      - name: Test (quick perft suite + smoke)
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: Full perft suite (release-grade check)
        if: matrix.preset == 'debug'
        run: ./build/debug/latent-oracle perftsuite
