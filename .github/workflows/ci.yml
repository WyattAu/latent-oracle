name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            compiler: g++
          - preset: clang-debug
            compiler: clang++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j
      - name: Test (quick perft suite + smoke)
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: Full perft suite (release-grade check)
        if: matrix.preset == 'debug'
        run: ./build/debug/latent-oracle perftsuite
      - name: Inference parity gate (FP32 + INT8, needs data repo as sibling)
        if: matrix.preset == 'debug'
        run: |
          git clone --depth 1 https://github.com/WyattAu/latent-oracle-data.git ../latent-oracle-data
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy python-chess
          python3 tests/ci_parity.py --engine build/debug/latent-oracle
      - name: Movegen differential fuzz vs python-chess
        if: matrix.preset == 'debug'
        run: |
          pip install python-chess
          python3 tests/fuzz_movegen.py --engine build/debug/latent-oracle \
            --positions 300 --deep 15
